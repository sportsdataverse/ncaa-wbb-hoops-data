[project]
name = "ncaa-wbb-hoops-data"
version = "0.1.0"
description = "Python producer for the stats.ncaa.org NCAA women's basketball release datasets (parquet/csv), reshaping ncaa-wbb-hoops-raw into season-level tidy datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0,<2.0",
    "sportsdataverse",
    "tqdm",
    "requests",
]

[project.scripts]
ncaa-wbb-data-build = "ncaa_wbb_data_build.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E712: polars bool masks are written `pl.col("c") == True` on purpose.
ignore = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["ncaa_wbb_data_build"]

# sdv-py's NCAA parsers (ncaa_wbb_team_ids, etc.) are not yet on PyPI, so the
# derived datasets resolve `sportsdataverse` to the local sibling checkout
# (editable). Swap to the PyPI pin once a release ships NCAA support.
[tool.uv.sources]
# Git source, not a local path: a `../../sdv-py` pin makes the repo buildable
# only on a machine with this exact sibling layout (it fails on CI and for any
# other contributor). Matches the convention in the stats-raw repos. For local
# sdv-py work, override with:
#   uv pip install -e ../../sdv-py
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["ncaa_wbb_data_build*"]
